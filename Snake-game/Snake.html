
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
<link rel="sicon" href="./snake.webp">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    canvas {
      background: #111827;
      border: 4px solid #22c55e;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
    }
  </style>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen text-white font-sans">

  <div class="text-center">
    <h1 class="text-5xl font-bold text-green-400 mb-4 animate-pulse">
      Snake Game
    </h1>

    <div class="flex justify-between items-center mb-4 px-2">
      <p class="text-xl">Score: <span id="score">0</span></p>

      <button
        id="restartBtn"
        class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded-lg font-semibold transition"
      >
        Restart
      </button>
    </div>

    <canvas id="game" width="400" height="400"></canvas>

    <p class="mt-4 text-gray-300">
      Use Arrow Keys ⬅️⬆️➡️⬇️ to move
    </p>
  </div>

  <script src="snake.js"></script>
</body>
</html>
